# input.example.yaml -- copy to config/input.yaml and fill in EVERY field marked CHANGE_ME.
# The agent runs tools/preflight.sh first; if input.yaml is missing or incomplete it STOPS and asks you to fill it.
#
# SECRETS: never write a key, password or token into this file. Every secret is a FILE PATH (field name ends in
# _file); the file holds the secret on its first line, mode 600, outside any git repo. The tools read the file
# only at the moment of the call and never print it. A field named like a secret without "_file" is refused.

platform:
  url: https://quality-check-omega.vercel.app/api      # QualityCheck platform API base
  app_id: CHANGE_ME                                     # your TopStor application id on the platform (X-App-Id); "" if not needed
  tester_key_file: /root/secrets/qc-tester.key          # tester API key (qc_...), first line; used for ALL step results
  # admin_key_file: /root/secrets/qc-admin.key          # optional; never used for results (sheet text changes only)

cluster:
  flavour: container            # container = TopStor nodes are containers on one shared kernel; physical = real servers or VMs
  cluster_ip: CHANGE_ME         # cluster (portal) address of cluster 1 (YOUR network, e.g. 192.168.10.200)
  subnet_bits: 24
  first_boot_ip: CHANGE_ME      # address a freshly reset TopStor node sits on before it is configured (product default 10.11.11.250 on the dev setup)
  discovery_ip: CHANGE_ME       # discovery etcd address used during a join (product default 10.11.11.253 on the dev setup)
  api_port: 5001                # TopStor REST API port (http://<ip>:5001/api/v1)
  admin_user: admin
  admin_password_file: /root/secrets/topstor-admin.pw         # admin password the tests use on cluster 1
  # reset_admin_password_file: /root/secrets/topstor-default.pw  # password right after docker_setup.sh reset (default: admin_password_file)
  # second cluster (replication tests); leave empty when there is none
  second_cluster_ip: ""
  # second_admin_password_file: /root/secrets/topstor-admin2.pw
  # to give the example above no meaning: nothing in the tools has a built-in address; every address comes from this file
  settle_seconds: 300           # real settle after EVERY node start/return and before EVERY stop
  isinsync_timeout: 300

# One entry per machine. type: container | physical | virtualbox.  role: primary | member | replication-primary |
# replication-member | client.  cluster: 1 (main cluster) or 2 (replication peer).  host = the address the node is
# reached with (its node IP); node-exec uses docker exec / ssh, never a TTY.
nodes:
  - name: node1
    type: container
    container: CHANGE_ME        # docker container name of this node
    docker_host: ""             # optional: DOCKER_HOST of a remote docker engine (e.g. ssh://root@10.0.0.5)
    host: CHANGE_ME             # this node's IP (the address the node is reached with)
    alias: CHANGE_ME            # short name the node gets in the cluster (a-z0-9)
    role: primary
    cluster: 1
  - name: node2
    type: container
    container: CHANGE_ME
    host: CHANGE_ME
    alias: CHANGE_ME
    role: member
    cluster: 1
  # - name: srv1                # a physical server
  #   type: physical
  #   host: 192.168.1.21
  #   ssh_user: root
  #   ssh_port: 22
  #   ssh_key_file: /root/.ssh/id_qc       # optional (else the agent's default key / ssh-agent)
  #   start_command: ""         # optional host command that powers the server on (IPMI/wake-on-lan); without it
  #                             # node-start asks the user to power it on and waits for ssh
  #   role: member
  #   cluster: 1
  # - name: vm1                 # a VirtualBox VM
  #   type: virtualbox
  #   vbox_name: TopStor-node1  # name shown by VBoxManage list vms
  #   vbox_manager_ssh: ""      # optional user@hypervisor when VBoxManage runs on another machine
  #   host: 192.168.56.11
  #   ssh_user: root
  #   role: primary
  #   cluster: 1
  # - name: client1             # NFS/CIFS/iSCSI client used by share tests (never stopped by the cluster tools)
  #   type: container
  #   container: CHANGE_ME
  #   host: CHANGE_ME
  #   role: client

# container flavour only: the docker host that runs the node containers shares ONE kernel (ZFS, LIO, iSCSI).
container_host:
  test_disk_regex: CHANGE_ME   # regex of the loop backing files the tests may WIPE, e.g. '^/srv/qcdisks/'. Anything it matches is wiped: keep it narrow
  stale_loop_regex: CHANGE_ME  # regex of leftover loop backing files detached before a build, e.g. '^/srv/qcdisks/.*\.img$'
  # Host-side path of each container node's /root/loopdisks (the disk export list), as seen from the docker host (bind mount of the
  # container's /root). host-stale-clean.sh writes "none" to them even while the nodes are STOPPED (the build starts from stopped nodes).
  # Without an entry the list is only set on running nodes. Example: [/srv/node1/root/loopdisks, /srv/node2/root/loopdisks]
  loopdisks_files: []
  disk_dir: ""   # folder for the backing files of ts-disk-add.sh (container flavour)

repos:
  credential_file: /root/.git-credentials   # git "store" format file with YOUR GitHub token (path only)
  user_owner: CHANGE_ME                     # your GitHub account
  branch_prefix: QSD5.                       # fix branches are <prefix><N>; the latest pushed one is the base
  topstor:
    url: https://github.com/CHANGE_ME/TopStordev.git
    clone: /home/qc/repos/TopStor
  pace:
    url: https://github.com/CHANGE_ME/HC.git
    clone: /home/qc/repos/pace
  topstorweb:
    url: https://github.com/CHANGE_ME/TopStorWeb.git
    clone: /home/qc/repos/topstorweb
  upstream:                                 # the original repos the final pull requests go to
    topstor: moataznegm/TopStordev
    pace: moataznegm/HC
    topstorweb: moataznegm/TopStorWeb
    base_branch: CHANGE_ME                  # upstream branch the pull requests target
  node_paths:                               # where the three trees live on every node
    topstor: /TopStor
    pace: /pace
    topstorweb: /topstorweb

deploy:                         # how a fix reaches the nodes (tools/code-deploy.sh)
  method: product-push          # product-push = push the branch into the node software repo with the product's own systempush (the
                                # next reset/join/return pulls from there); bundle = quick test only, wiped by the next reset/join
  push_node: local              # where push_command runs: a node name, or "local" (this machine, which has the clones)
  push_command: CHANGE_ME       # the product's push into the software repo, e.g. 'SPD_ROOT=<parent of your clones> sh <TopStor clone>/systempush.sh {branch}'
  pull_command: ''              # optional, run on every node after the push, e.g. '/TopStor/csystempull.sh {branch}'
  branch: ''                    # the branch under test; when set, cluster-reset.sh refuses to run if it is not in the software repo
  software_repo_check_from: local   # where the branch check runs: local (this machine, works with all nodes stopped) | node (running primary)
  software_repo:                # git URLs of the node software repo (as the NODES see them), used to check the branch is there
    topstor: ''                 # e.g. git://CHANGE_ME:9418/TopStor
    pace: ''
    topstorweb: ''

loop:
  iteration_tests: []           # optional fixed list of test ids per iteration; empty = learn it from GET /tests
  report_interval_minutes: 3
  now_line_minutes: 3           # tester writes a NOW line at least this often
  context_limit_agent: 150000   # tokens: a non-coder agent above this at a test boundary finishes its test, writes RESUME and ends
  context_limit_coder: 250000   # coders: split by queue item, commit a working state, then end
  stuck_after_reports: 2        # supervisor nudges an agent after this many reports without change
  fail_needs_user_ok: false     # false = a validated FAIL (real app bug, validator verdict file) is submitted by the agents themselves.
                                # true  = strict stop rule of the original QC tester: STOP and ask the user before ANY FAIL is submitted.
                                # The value is printed in every supervisor snapshot. Pick one on purpose.
  reboot_for_tool_problems: true  # true = a host/hypervisor reboot may be requested for ANY tool problem or suspended/hung pool (with evidence
                                # in the log, after every other agent saved its state; never a container-engine restart, never sync).
                                # false = only for a suspended pool / hung kernel (evidence rule of docs/safety.md 5).

state_dir: ./state              # rounds, ledgers, timings, agent registry (never committed)
